[project]
name = "lexroom-api"
version = "0.1.0"
description = "Lexroom contract review API"
requires-python = ">=3.15"
dependencies = [
    "dj-database-url==3.1.2",
    "django==6.1.3",
    "django-ninja==1.7.3",
    "gunicorn==26.2.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-django==4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
